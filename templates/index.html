<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Касса</title>

<style>
body { font-family: Arial; background:#f4f6f9; padding:20px; }
h2 { text-align:center; }

#orders {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
    gap:15px;
}

.card {
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

button {
    margin-top:5px;
    width:100%;
    padding:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.cook { background:orange; color:white; }
.ready { background:green; color:white; }
</style>
</head>

<body>

<h2>🍔 Заказы</h2>
<div id="orders"></div>

<audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
let known = [];

async function load(){
    let res = await fetch('/api/orders');
    let data = await res.json();

    // 🔔 звук нового заказа
    if(data.length && !known.includes(data[0].id)){
        document.getElementById('sound').play();
    }
    known = data.map(o=>o.id);

    document.getElementById('orders').innerHTML =
        data.filter(o=>o.status!='ready').map(o => `
            <div class="card" id="o-${o.id}">
                <b>#${o.id}</b><br>
                ${o.text}<br>
                <small>${o.status}</small>

                ${o.status=='new' ? `<button class="cook" onclick="cook(${o.id})">Готовится</button>`:''}
                <button class="ready" onclick="ready(${o.id})">Готово</button>
            </div>
        `).join('');
}

async function cook(id){
    await fetch('/cook/'+id,{method:'POST'});
    load();
}

async function ready(id){
    await fetch('/ready/'+id,{method:'POST'});
    document.getElementById('o-'+id)?.remove();
}

setInterval(load,2000);
load();
</script>

</body>
</html>
