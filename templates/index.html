<!DOCTYPE html>
<html>
<head>
    <title>Orders</title>
</head>
<body>
<h2>🍔 Orders Panel</h2>

<div id="orders"></div>

<script>
async function load() {
    let res = await fetch('/api/orders')
    let data = await res.json()

    document.getElementById('orders').innerHTML =
        data.map(o => `
            <div style="border:1px solid #ccc; margin:10px; padding:10px">
                <b>#${o.id}</b> - ${o.username}<br>
                ${o.order_text}<br>
                <b>${o.status}</b><br>

                <button onclick="ready(${o.id})">Готово</button>
            </div>
        `).join('')
}

async function ready(id) {
    await fetch('/ready/' + id, {method:'POST'})
    load()
}

load()
setInterval(load, 3000)
</script>

</body>
</html>
