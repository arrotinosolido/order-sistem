<!DOCTYPE html>
<html>
<body style='font-family:sans-serif'>
<h1>Orders</h1>
<div id='d'></div>

<script>
async function load(){
 let r = await fetch('/api/orders');
 let j = await r.json();
 document.getElementById('d').innerHTML =
 j.map(o =>
 `<div>
 #${o.id} ${o.order_text} (${o.status})
 <button onclick="fetch('/ready/${o.id}',{method:'POST'}).then(load)">Ready</button>
 </div>`
 ).join('')
}
setInterval(load,2000)
load()
</script>
</body>
</html>
